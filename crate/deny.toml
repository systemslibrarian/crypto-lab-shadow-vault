# cargo-deny configuration for supply-chain security
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# cargo-deny 0.20 always rejects vulnerability/notice advisories.
# Scope every dependency for unmaintained advisories; do not ignore them.
unmaintained = "all"
unsound = "all"
yanked = "warn"

[licenses]
# The explicit allow list rejects unknown/unlicensed and copyleft licenses.
# Legacy unlicensed/copyleft fields were removed from cargo-deny.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
