name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The gate, called rather than copied -- the same three jobs the
  # Dependabot auto-merge waits on in security-tests.yml.
  gate:
    uses: ./.github/workflows/gate.yml

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build the WASM crypto core from source so the deployed artifact is
      # provably the one the audited Rust produces — not a stale committed blob.
      # Build the WASM crypto core from source so the deployed artifact is
      # provably the one the audited Rust produces — not a stale committed blob.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Gate deploy on the crypto test suite — never ship failing crypto.
      - name: Build WASM from source
        run: npm run wasm
      - name: Build app
        run: npm run build

      # Gate deploy on both browser suites, run against the production build.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: [gate, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
