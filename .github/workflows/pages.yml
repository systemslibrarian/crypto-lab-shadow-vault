name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build the WASM crypto core from source so the deployed artifact is
      # provably the one the audited Rust produces — not a stale committed blob.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Gate deploy on the crypto test suite — never ship failing crypto.
      - name: Run Rust crypto tests (release)
        run: cargo test --release
        working-directory: crate

      - name: Build WASM from source
        run: npm run wasm
      - name: TypeScript type check (strict)
        run: npx tsc --noEmit
      - name: Build app
        run: npm run build

      # Gate deploy on both browser suites, run against the production build.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # tests/browser/vault.spec.ts — the WASM integration suite: the engine
      # self-test, the full encrypt/decrypt round-trip, INV-2 failure
      # indistinguishability, the CSP header, and the strength estimator.
      # Unlike most labs in this fleet, `test:a11y` here takes
      # `--config=playwright.a11y.config.ts`, whose testDir is ./e2e — so it
      # collects the axe specs ONLY, and this suite really was skipped on
      # deploy. It runs in security-tests.yml, but that is a separate workflow
      # on the same push and cannot stop the deploy that push triggers.
      - name: WASM integration gate (browser)
        run: npm run test:browser
        env:
          CI: true

      - name: Accessibility gate (axe, both themes)
        run: npm run test:a11y
        env:
          CI: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
