name: Security & Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust Tests & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate

      # Formatting check
      - name: Check formatting
        run: cargo fmt -- --check
        working-directory: crate

      # Clippy with all warnings as errors
      - name: Cargo clippy (strict)
        run: cargo clippy --release --all-targets -- -D warnings -D clippy::unwrap_used -W clippy::pedantic
        working-directory: crate

      # Unit + property tests
      - name: Run Rust tests (release)
        run: cargo test --release -- --nocapture
        working-directory: crate

      # Security audit of dependencies.
      # Pinned for compatibility with the rustc version in rust-toolchain.toml
      # (1.87.0); newer cargo-audit (0.22.2+) requires rustc 1.88+.
      - name: Install cargo-audit
        run: cargo install cargo-audit@0.22.1 --locked
      - name: Cargo audit
        run: cargo audit
        working-directory: crate

      # Check for known-vulnerable dependencies
      - name: Install cargo-deny
        run: cargo install cargo-deny@0.18.3 --locked
      - name: Cargo deny (advisories + licenses)
        run: cargo deny check advisories licenses
        working-directory: crate
        continue-on-error: true  # advisory DB may lag

      # WASM build verification
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM
        run: wasm-pack build --target web --out-dir ../pkg --release
        working-directory: crate

      # Verify WASM output hash (reproducibility check)
      - name: Record WASM hash
        run: sha256sum pkg/shadow_vault_crypto_bg.wasm

  typescript-checks:
    name: TypeScript & Lint
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Rust/WASM build (needed for TS compilation)
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM
        run: npm run wasm

      - run: npm ci

      # TypeScript strict check
      - name: TypeScript type check (strict)
        run: npx tsc --noEmit

      # npm audit for JS deps
      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true  # dev deps may have advisories

  browser-tests:
    name: Browser Integration Tests
    runs-on: ubuntu-latest
    needs: [rust-tests, typescript-checks]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM
        run: npm run wasm

      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build app
        run: npm run build
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

  # Dependabot only. Depends on every gate job in this workflow, so a bump can
  # only merge itself once this lab's whole PR gate went green. Majors are
  # excluded -- the 2026-08-18 batch had to hold back 109 bumps and they were
  # overwhelmingly majors (@noble v2 dropped export subpaths, TypeScript 7,
  # vitest 4), so those still want a human.
  dependabot-auto-merge:
    needs: [rust-tests, typescript-checks, browser-tests]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      # Majors included on purpose. `needs:` above already required the whole
      # gate to pass, and that gate -- unit tests, build, axe WCAG and the e2e
      # claims -- judges a bump far better than its version number does. A major
      # that actually breaks this lab fails the gate and stays open for a human.
      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              exit 0
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          echo "::warning::gate passed but the merge did not land after 3 attempts;"
          echo "::warning::leaving this PR open - Dependabot will rebase and retry."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
      # them so workflows cannot retrigger themselves -- so deploy would never run
      # and the site would keep serving the previous build. Ask for it explicitly;
      # a workflow_dispatch through the API is not suppressed. The dispatched run
      # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
      - name: Deploy the merged result
        if: success()
        run: |
          if gh pr view "$PR_URL" --json state --jq .state | grep -q MERGED; then
            gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main \
              || echo "::warning::deploy dispatch failed; run pages.yml by hand"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
